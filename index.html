<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>DzClean - تسجيل الدخول | Demo</title>
<style>
body{font-family:sans-serif; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
.box{background:#1e293b; padding:30px; border-radius:15px; width:300px; text-align:center}
input{width:90%; padding:10px; margin:10px 0; border-radius:8px; border:none}
button{background:#22c55e; color:white; border:none; padding:12px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer}
small{color:#94a3b8}
</style>
</head>
<body>
<div class="box">
<h2>DzClean - Demo</h2>
<p>هاذي صفحة تجريبية للتعلم فقط</p>
<input type="text" id="user" placeholder="اسم المستخدم">
<input type="password" id="pass" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
<p id="msg"></p>
<small>التجربة: admin / DzClean123!</small>
</div>

<script>
let tries = 0;
function login(){
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  tries++;
  // حماية ضد Hydra: بعد 3 محاولات نحبسوه
  if(tries > 3){
    document.getElementById('msg').innerText = "تم حظرك مؤقتا! حاولت بزاف - هاذي هي الحماية ضد Hydra";
    return;
  }
  if(u === "admin" && p === "DzClean123!"){
    document.getElementById('msg').innerText = "مرحبا بيك! دخلت بنجاح";
  } else {
    document.getElementById('msg').innerText = "غلطة! بقاولك " + (3 - tries + 1) + " محاولات";
  }
}
</script>
</body>
</html>
